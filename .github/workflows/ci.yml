name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      # The default PyPI torch wheel pulls in the full CUDA toolkit
      # (multi-GB of nvidia-*/cuda-* packages) even on a GPU-less CI runner —
      # installing the CPU-only build from PyTorch's own index first (same
      # trick as backend/Dockerfile) keeps this job fast.
      - name: Install CPU-only torch
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No secrets available (or needed) in CI — .env.example's placeholder
      # values are enough to confirm the compose file itself is well-formed
      # and every variable interpolation resolves.
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
